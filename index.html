<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fars Samling – Spiritus</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Fars Spiritus">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background-color: #faf6f0;
            margin: 0;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2b2320;
        }
        .container {
            max-width: 440px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            padding: 24px 20px 16px;
            background: #5e1b26;
            color: #f3e9df;
        }
        .header .kicker { font-size: 11px; letter-spacing: 2px; opacity: .75; font-family: -apple-system, sans-serif; }
        .header h1 { font-size: 24px; margin: 4px 0 0; font-weight: normal; }
        .body { padding: 16px 20px 20px; }

        .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tabs button {
            flex: 1; padding: 10px 4px; border: none; background: #efe5d8;
            border-radius: 10px; font-size: 12px; font-weight: 600; color: #6b5a3f;
            cursor: pointer; font-family: -apple-system, sans-serif;
        }
        .tabs button.active { background: #2b2320; color: #fff; }
        .panel { display: none; }
        .panel.active { display: block; }

        label { display: block; font-size: 13px; color: #8a7a6c; margin: 10px 0 4px; font-family: -apple-system, sans-serif; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 13px; border: 1px solid #e3d8c8; border-radius: 10px;
            font-size: 16px; font-family: -apple-system, sans-serif;
        }
        select {
            width: 100%; padding: 13px; border: 1px solid #e3d8c8; border-radius: 10px;
            font-size: 15px; font-family: -apple-system, sans-serif; background: white;
        }
        .checkrow { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-family: -apple-system, sans-serif; font-size: 14px; }

        button.primary {
            width: 100%; padding: 14px; background: #5e1b26; color: white; border: none;
            border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 14px;
            font-family: -apple-system, sans-serif;
        }

        .status-text { text-align: center; color: #8a7a6c; font-size: 13px; padding: 10px 0; font-family: -apple-system, sans-serif; }

        .results { margin-top: 10px; }
        .result-row {
            display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0e9df; align-items: center;
        }
        .result-row:last-child { border-bottom: none; }
        .result-cover { width: 40px; height: 56px; object-fit: cover; border-radius: 5px; background: #efe5d8; flex-shrink: 0; }
        .result-info { flex: 1; min-width: 0; font-family: -apple-system, sans-serif; }
        .result-title { font-size: 14px; font-weight: 600; }
        .result-sub { font-size: 12px; color: #8a7a6c; }
        .add-small-btn {
            background: #5e1b26; color: white; border: none; border-radius: 8px;
            padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
            font-family: -apple-system, sans-serif;
        }

        #scanVideo { width: 100%; border-radius: 12px; background: #000; display: block; }
        .scan-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .scan-btn-row button {
            flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px;
            font-weight: 600; cursor: pointer; font-family: -apple-system, sans-serif;
        }
        #startScanBtn { background: #3f6b4f; color: white; }
        #stopScanBtn { background: #a8342f; color: white; }

        .pills { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 6px; font-family: -apple-system, sans-serif; font-size: 12px; }
        .pill { white-space: nowrap; padding: 7px 13px; border-radius: 16px; background: #efe5d8; color: #6b5a3f; cursor: pointer; }
        .pill.active { background: #2b2320; color: #fff; }

        .count { text-align: center; color: #8a7a6c; font-size: 12px; margin-top: 2px; font-family: -apple-system, sans-serif; }

        .item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f0e9df; }
        .item:last-child { border-bottom: none; }
        .item-cover { width: 34px; height: 50px; object-fit: cover; border-radius: 4px; background: #efe5d8; flex-shrink: 0; }
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-size: 15px; }
        .item-meta { font-size: 12px; color: #8a7a6c; margin-top: 3px; font-family: -apple-system, sans-serif; }
        .item-note { font-size: 11px; color: #a8552f; margin-top: 4px; font-family: -apple-system, sans-serif; }
        .open-badge {
            font-size: 10px; background: #e6efe8; color: #3f6b4f; padding: 3px 8px;
            border-radius: 10px; font-family: -apple-system, sans-serif; flex-shrink: 0;
        }
        .stepper { display: flex; align-items: center; gap: 7px; font-family: -apple-system, sans-serif; flex-shrink: 0; }
        .stepper button {
            width: 24px; height: 24px; border-radius: 50%; background: #efe5d8; border: none;
            font-size: 14px; cursor: pointer; line-height: 24px; padding: 0;
        }
        .stepper .n { font-size: 14px; min-width: 9px; text-align: center; }
        .delete-btn { background: none; border: none; color: #c0504f; font-size: 17px; cursor: pointer; padding: 4px 6px; }

        .empty-state { text-align: center; color: #8a7a6c; padding: 24px 10px; font-size: 14px; font-family: -apple-system, sans-serif; }

        .backup-row { display: flex; gap: 10px; margin-top: 16px; }
        .backup-row button {
            flex: 1; padding: 10px; border: 1px solid #e3d8c8; background: white; border-radius: 10px;
            font-size: 12px; font-weight: 600; color: #6b5a3f; cursor: pointer; font-family: -apple-system, sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="kicker">FARS SAMLING</div>
            <h1>🍷 Spiritussamling</h1>
        </div>
        <div class="body">

            <div class="tabs">
                <button type="button" id="tabSoegBtn" class="active" onclick="skiftTab('soeg')">🔎 Søg</button>
                <button type="button" id="tabScanBtn" onclick="skiftTab('scan')">📷 Scan</button>
                <button type="button" id="tabManuelBtn" onclick="skiftTab('manuel')">✏️ Manuelt</button>
            </div>

            <div id="panelSoeg" class="panel active">
                <label for="kategoriSoeg">Kategori den tilføjes som</label>
                <select id="kategoriSoeg">
                    <option>Rødvin</option><option>Hvidvin</option><option>Champagne</option>
                    <option>Portvin</option><option>Bourbon</option><option>Whisky</option>
                    <option>Rom</option><option>Diverse</option>
                </select>
                <label for="soegefelt">Søg efter navn</label>
                <input type="text" id="soegefelt" placeholder="F.eks. Baricci Brunello" oninput="soegMedForsinkelse()">
                <div id="soegStatus" class="status-text"></div>
                <div id="soegResultater" class="results"></div>
            </div>

            <div id="panelScan" class="panel">
                <label for="kategoriScan">Kategori den tilføjes som</label>
                <select id="kategoriScan">
                    <option>Rødvin</option><option>Hvidvin</option><option>Champagne</option>
                    <option>Portvin</option><option>Bourbon</option><option>Whisky</option>
                    <option>Rom</option><option>Diverse</option>
                </select>
                <video id="scanVideo" muted playsinline></video>
                <div class="scan-btn-row">
                    <button type="button" id="startScanBtn" onclick="startScanner()">📷 Start kamera</button>
                    <button type="button" id="stopScanBtn" onclick="stopScanner()" style="display:none;">Stop kamera</button>
                </div>
                <div id="scanStatus" class="status-text"></div>
                <div id="scanResultater" class="results"></div>
            </div>

            <div id="panelManuel" class="panel">
                <label for="mNavn">Navn</label>
                <input type="text" id="mNavn" placeholder="F.eks. Blanton's, Gold Edition">

                <label for="mKategori">Kategori</label>
                <select id="mKategori">
                    <option>Rødvin</option><option>Hvidvin</option><option>Champagne</option>
                    <option>Portvin</option><option>Bourbon</option><option>Whisky</option>
                    <option>Rom</option><option>Diverse</option>
                </select>

                <label for="mAar">Årgang (valgfrit)</label>
                <input type="number" id="mAar" placeholder="F.eks. 2013">

                <label for="mStyrke">Styrke % (valgfrit)</label>
                <input type="number" step="0.1" id="mStyrke" placeholder="F.eks. 46.5">

                <label for="mHylde">Hylde / placering (valgfrit)</label>
                <input type="text" id="mHylde" placeholder="F.eks. Skab 1, Hylde 4">

                <label for="mAntal">Antal</label>
                <input type="number" id="mAntal" value="1" min="0">

                <label for="mPris">Pris (valgfrit)</label>
                <input type="number" id="mPris" placeholder="F.eks. 350">

                <div class="checkrow">
                    <input type="checkbox" id="mAaben">
                    <label for="mAaben" style="margin:0;">Allerede åbnet</label>
                </div>

                <button class="primary" onclick="tilfoejManuelt()">Tilføj til samlingen</button>
            </div>

            <div class="pills" id="kategoriPills"></div>

            <label for="listeSoegefelt">Søg i samlingen</label>
            <input type="text" id="listeSoegefelt" placeholder="Søg på navn..." oninput="visListe()">

            <div class="count" id="antal"></div>
            <div id="liste"></div>

            <div class="backup-row">
                <button type="button" onclick="eksporterSamling()">⬇️ Eksportér</button>
                <button type="button" onclick="document.getElementById('importFil').click()">⬆️ Importér</button>
            </div>
            <input type="file" id="importFil" accept="application/json" style="display:none;" onchange="importerSamling(event)">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script>
        const KATEGORIER = ['Alle','Rødvin','Hvidvin','Champagne','Portvin','Bourbon','Whisky','Rom','Diverse'];
        let aktivFilter = 'Alle';
        let soegTimer = null;
        let codeReader = null;

        function skiftTab(tab) {
            ['soeg','scan','manuel'].forEach(t => {
                document.getElementById('panel' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
                document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn').classList.toggle('active', t === tab);
            });
            if (tab !== 'scan') stopScanner();
        }

        function tegnPills() {
            const container = document.getElementById('kategoriPills');
            container.innerHTML = KATEGORIER.map(k =>
                `<div class="pill${k === aktivFilter ? ' active' : ''}" onclick="vaelgFilter('${k}')">${k}</div>`
            ).join('');
        }

        function vaelgFilter(k) {
            aktivFilter = k;
            tegnPills();
            visListe();
        }

        // ---------- Søgning via Open Food Facts ----------
        function soegMedForsinkelse() {
            clearTimeout(soegTimer);
            soegTimer = setTimeout(soeg, 500);
        }

        async function soeg() {
            const query = document.getElementById('soegefelt').value.trim();
            const statusDiv = document.getElementById('soegStatus');
            const resultDiv = document.getElementById('soegResultater');

            if (query === '') { statusDiv.textContent = ''; resultDiv.innerHTML = ''; return; }

            statusDiv.textContent = 'Søger...';
            resultDiv.innerHTML = '';

            try {
                const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&json=1&page_size=8`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Netværksfejl');
                const data = await response.json();
                visResultater(data.products, statusDiv, resultDiv, 'soegKategori');
            } catch (e) {
                statusDiv.textContent = 'Søgningen fejlede. Du kan tilføje den manuelt i stedet.';
            }
        }

        function visResultater(produkter, statusDiv, resultDiv, _ukendt) {
            if (!produkter || produkter.length === 0) {
                statusDiv.textContent = 'Intet fundet. Du kan tilføje den manuelt i stedet.';
                return;
            }
            statusDiv.textContent = '';
            resultDiv.innerHTML = produkter.slice(0, 8).map(p => {
                const navn = p.product_name || p.generic_name || 'Ukendt navn';
                const maerke = p.brands || '';
                const billede = p.image_front_small_url || p.image_small_url || p.image_url || '';
                return `
                    <div class="result-row">
                        ${billede ? `<img class="result-cover" src="${billede}" alt="">` : '<div class="result-cover"></div>'}
                        <div class="result-info">
                            <div class="result-title">${escapeHtml(navn)}</div>
                            <div class="result-sub">${escapeHtml(maerke)}</div>
                        </div>
                        <button class="add-small-btn" onclick="tilfoejFraOpslag('${escapeHtml(navn).replace(/'/g, "\\'")}', '${billede.replace(/'/g, "\\'")}')">Tilføj</button>
                    </div>
                `;
            }).join('');
        }

        function tilfoejFraOpslag(navn, billede) {
            const aktivtPanel = document.querySelector('.panel.active').id;
            const kategoriSelect = aktivtPanel === 'panelScan' ? 'kategoriScan' : 'kategoriSoeg';
            const kategori = document.getElementById(kategoriSelect).value;

            const samling = hentSamling();
            samling.push({
                id: Date.now(),
                navn: navn,
                kategori: kategori,
                aar: '', styrke: '', hylde: '', pris: '',
                antal: 1, aaben: false, noter: [], billede: billede || ''
            });
            gemSamling(samling);

            const statusId = aktivtPanel === 'panelScan' ? 'scanStatus' : 'soegStatus';
            document.getElementById(statusId).textContent = `"${navn}" blev tilføjet som ${kategori}! ✅`;
            visListe();
        }

        // ---------- Stregkodescanner ----------
        function startScanner() {
            const statusDiv = document.getElementById('scanStatus');
            document.getElementById('scanResultater').innerHTML = '';

            if (typeof ZXing === 'undefined') {
                statusDiv.textContent = 'Scanneren kunne ikke indlæses. Tjek din internetforbindelse.';
                return;
            }

            codeReader = new ZXing.BrowserMultiFormatReader();
            statusDiv.textContent = 'Åbner kamera... (sig ja til tilladelsen)';
            document.getElementById('startScanBtn').style.display = 'none';
            document.getElementById('stopScanBtn').style.display = 'block';

            codeReader.decodeFromVideoDevice(undefined, 'scanVideo', (result) => {
                if (result) haandterStregkode(result.getText());
            }).then(() => {
                statusDiv.textContent = 'Peg kameraet mod stregkoden på bagsiden.';
            }).catch(() => {
                statusDiv.textContent = 'Kunne ikke få adgang til kameraet.';
                stopScanner();
            });
        }

        function stopScanner() {
            if (codeReader) { codeReader.reset(); codeReader = null; }
            document.getElementById('startScanBtn').style.display = 'block';
            document.getElementById('stopScanBtn').style.display = 'none';
        }

        async function haandterStregkode(stregkode) {
            stopScanner();
            const statusDiv = document.getElementById('scanStatus');
            const resultDiv = document.getElementById('scanResultater');
            statusDiv.textContent = `Fundet: ${stregkode} — slår op...`;
            resultDiv.innerHTML = '';

            try {
                const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(stregkode)}.json`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 1 && data.product) {
                    visResultater([data.product], statusDiv, resultDiv, 'scanKategori');
                } else {
                    statusDiv.textContent = `Ingen oplysninger fundet for stregkode ${stregkode}. Tilføj den manuelt i stedet.`;
                }
            } catch (e) {
                statusDiv.textContent = `Stregkode ${stregkode} fundet, men opslaget fejlede.`;
            }
        }

        // ---------- Manuel tilføjelse ----------
        function tilfoejManuelt() {
            const navn = document.getElementById('mNavn').value.trim();
            if (navn === '') { alert('Skriv venligst et navn først!'); return; }

            const samling = hentSamling();
            samling.push({
                id: Date.now(),
                navn: navn,
                kategori: document.getElementById('mKategori').value,
                aar: document.getElementById('mAar').value.trim(),
                styrke: document.getElementById('mStyrke').value.trim(),
                hylde: document.getElementById('mHylde').value.trim(),
                antal: parseInt(document.getElementById('mAntal').value) || 0,
                pris: document.getElementById('mPris').value.trim(),
                aaben: document.getElementById('mAaben').checked,
                noter: [],
                billede: ''
            });
            gemSamling(samling);

            document.getElementById('mNavn').value = '';
            document.getElementById('mAar').value = '';
            document.getElementById('mStyrke').value = '';
            document.getElementById('mHylde').value = '';
            document.getElementById('mAntal').value = '1';
            document.getElementById('mPris').value = '';
            document.getElementById('mAaben').checked = false;

            visListe();
        }

        // ---------- Lager / localStorage ----------
        function hentSamling() {
            try {
                const data = localStorage.getItem('farsSpiritus');
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function gemSamling(samling) {
            localStorage.setItem('farsSpiritus', JSON.stringify(samling));
        }

        function aendreAntal(id, delta) {
            const samling = hentSamling();
            const item = samling.find(i => i.id === id);
            if (!item) return;
            item.antal = Math.max(0, (item.antal || 0) + delta);
            gemSamling(samling);
            visListe();
        }

        function slet(id) {
            let samling = hentSamling();
            samling = samling.filter(i => i.id !== id);
            gemSamling(samling);
            visListe();
        }

        function tilfoejNote(id) {
            const tekst = prompt('Skriv en smagsnote:');
            if (!tekst) return;
            const samling = hentSamling();
            const item = samling.find(i => i.id === id);
            if (!item) return;
            if (!item.noter) item.noter = [];
            const dato = new Date().toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' });
            item.noter.push({ dato, tekst });
            gemSamling(samling);
            visListe();
        }

        function visListe() {
            const soegning = document.getElementById('listeSoegefelt').value.trim().toLowerCase();
            const samling = hentSamling();

            const filtreret = samling
                .filter(item => aktivFilter === 'Alle' || item.kategori === aktivFilter)
                .filter(item => item.navn.toLowerCase().includes(soegning))
                .sort((a, b) => a.navn.localeCompare(b.navn, 'da'));

            const listeDiv = document.getElementById('liste');
            const antalDiv = document.getElementById('antal');

            antalDiv.textContent = samling.length === 0 ? '' : `${samling.length} ting i samlingen`;

            if (filtreret.length === 0) {
                listeDiv.innerHTML = samling.length === 0
                    ? '<div class="empty-state">Samlingen er tom endnu.<br>Søg, scan eller tilføj manuelt ovenfor!</div>'
                    : '<div class="empty-state">Ingen fund.</div>';
                return;
            }

            listeDiv.innerHTML = filtreret.map(item => {
                const sidsteNote = item.noter && item.noter.length ? item.noter[item.noter.length - 1] : null;
                const metaDele = [item.kategori];
                if (item.aar) metaDele.push(item.aar);
                if (item.styrke) metaDele.push(item.styrke + '%');
                if (item.hylde) metaDele.push(item.hylde);
                if (item.pris) metaDele.push(item.pris + ' kr');

                return `
                <div class="item">
                    ${item.billede ? `<img class="item-cover" src="${item.billede}" alt="">` : '<div class="item-cover"></div>'}
                    <div class="item-info">
                        <div class="item-title">${escapeHtml(item.navn)}</div>
                        <div class="item-meta">${escapeHtml(metaDele.join(' · '))}</div>
                        ${sidsteNote ? `<div class="item-note">📝 ${escapeHtml(sidsteNote.dato)} — "${escapeHtml(sidsteNote.tekst)}"</div>` : ''}
                    </div>
                    ${item.aaben ? '<div class="open-badge">Åben</div>' : `
                        <div class="stepper">
                            <button onclick="aendreAntal(${item.id}, -1)">–</button>
                            <div class="n">${item.antal}</div>
                            <button onclick="aendreAntal(${item.id}, 1)">+</button>
                        </div>
                    `}
                    <button class="delete-btn" onclick="tilfoejNote(${item.id})" title="Tilføj note">📝</button>
                    <button class="delete-btn" onclick="slet(${item.id})" aria-label="Slet">🗑️</button>
                </div>
            `;
            }).join('');
        }

        // ---------- Eksport / import ----------
        function eksporterSamling() {
            const samling = hentSamling();
            if (samling.length === 0) { alert('Samlingen er tom.'); return; }
            const blob = new Blob([JSON.stringify(samling, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dato = new Date().toISOString().substring(0, 10);
            a.href = url;
            a.download = `fars-spiritussamling-${dato}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importerSamling(event) {
            const fil = event.target.files[0];
            if (!fil) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const importeret = JSON.parse(e.target.result);
                    if (!Array.isArray(importeret)) throw new Error('Forkert format');
                    const eksisterende = hentSamling();
                    const kendteIds = new Set(eksisterende.map(i => i.id));
                    let tilfoejet = 0;
                    importeret.forEach(item => {
                        if (item && item.navn && !kendteIds.has(item.id)) {
                            eksisterende.push(item);
                            tilfoejet++;
                        }
                    });
                    gemSamling(eksisterende);
                    visListe();
                    alert(`${tilfoejet} ting blev importeret!`);
                } catch (err) {
                    alert('Filen kunne ikke læses.');
                }
                event.target.value = '';
            };
            reader.readAsText(fil);
        }

        function escapeHtml(tekst) {
            const div = document.createElement('div');
            div.textContent = tekst;
            return div.innerHTML;
